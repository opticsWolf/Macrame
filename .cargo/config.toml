# Test-harness settings for R15 (see the risk register in docs/).
#
# libSQL faults with STATUS_ACCESS_VIOLATION (0xc0000005) when local databases
# are opened *concurrently* in one process. It is not a Macrame defect: it
# reproduces with no Macrame types in the loop, it is not confined to any one
# test binary -- storage_boundary, vector_filter, replay_snapshot, write_path
# and the property binaries have all died mid-run -- and upgrading the
# dependency 0.6.0 -> 0.9.30 did not change it.
#
# ---------------------------------------------------------------------------
# If you are here because the build went red, read this paragraph first.
# ---------------------------------------------------------------------------
#
# Re-run the failing binary on its own. Every binary that has died during a
# suite run is clean in isolation -- four of them at 0/15 each, 60 isolated runs
# with no fault. A binary that fails alone is a real failure; one that only
# fails inside the suite is almost certainly this.
#
# And note the reporting hazard, because it is the opposite of what you expect:
# the fault kills the process, so the tests that already printed `ok` are
# reported, the ones behind it are silent, and that binary's `test result:` line
# never appears. **A pass-count sum therefore comes back SMALLER with no
# failures rather than red.** Anything gating on this suite must key on the
# absence of a per-target result line, and `--no-fail-fast` is not optional or
# everything alphabetically behind the fault is skipped as well.
#
# ---------------------------------------------------------------------------
# What is known, and what was believed here and is not true
# ---------------------------------------------------------------------------
#
# The trigger was recorded here as CONCURRENT OPEN from 0.6.0 to 0.12.0, on a
# standalone reproducer (libsql 0.9.30, Windows, release, tokio multi-thread,
# one file per task):
#
#     500 opens, sequential, one process         0/10
#     4 / 8 / 16 concurrent opens                0/10 each
#     32 concurrent opens                        2/12
#     128 concurrent opens                       5/12
#     128 concurrent, nothing dropped until end  3/12
#
# THAT DIAGNOSIS IS WRONG, and the reason it held for six releases is that the
# sequential row stopped at 500. Re-measured 2026-08-15 (0.12.1, D-148) with
# `examples/r15_soak.rs --arm storm`, which runs the open storm with no soak
# database, no readers and no actor, and puts each variable behind its own flag
# (libsql 0.9.30, Windows, RELEASE, --opens 48 --secs 3 --runs 10):
#
#     sequential, CURRENT-THREAD runtime         2/10   <- no overlap, no migration
#       clean runs reached 9,792-10,416 opens
#
# One task, one OS thread, open -> connect -> query -> drop in a loop, nothing
# overlapping anything. It still faults. 500 sequential opens is 0/10 because
# 500 is simply under the threshold, not because sequential is safe.
#
# The rest of the matrix (debug, --secs 2, n = 6-8 -- read as eliminated / not
# eliminated, NEVER as rates; see the noise-band note further down):
#
#     --first-use build (no connect() at all)    0/6    <- ~880,000 opens per run
#     --first-use connect (no query)             6/6
#     --serial-opens   (build() under a mutex)   6/6
#     --serial-connect (connect() under a mutex) 5/6
#     --hold (every handle dropped in parent)    6/6
#     --sequential (multi-thread runtime)        4/6
#
# So it is not simultaneity, not thread migration, and not teardown. What
# survives every arm is CUMULATIVE connect() VOLUME: build() alone is clean
# through ~880,000 opens per run, and adding connect() kills the process within
# a few thousand however they are spread across threads and time.
#
# This also resolves the anomaly flagged below as unexplained -- every binary
# 0/15 alone while the serialised suite is 5/10. No hidden concurrency is
# needed: the suite performs far more cumulative connect() calls than any one
# binary does. And it is why serialising anything, including RUST_TEST_THREADS,
# reduces a rate without removing a fault. Serialising does not lower the total.
#
# STILL OPEN (W1.2a): whether the threshold is a fixed cumulative count or a
# per-connect() probability. Clean runs above passed 10,416 opens while others
# died earlier, which looks probabilistic rather than like a hard ceiling.
# Settling it needs the running total printed as it goes and n large enough to
# clear the noise band. That is what would make this reportable upstream as a
# leak with a number attached.
#
# ---------------------------------------------------------------------------
# What this setting does, and what it does not
# ---------------------------------------------------------------------------
#
# Serialising libtest REDUCES THE RATE. It does not remove the fault, and an
# earlier version of this file said that it did:
#
#     0.5.4, full suite, libtest default (parallel)   1/20 bad runs
#     0.5.4, full suite, --test-threads=1             0/30 bad runs
#     0.5.6, full suite, --test-threads=1             5/10 bad runs
#
# Same dependency version throughout, and the last row was measured WITH this
# setting in force. Either the rate rose with the suite (171 -> 221 tests) or
# the original 0/30 was a lucky streak. Read 0/30 as a data point, not as a
# guarantee this file provides.
#
# One thing this did not explain, and D-148 now does: every binary is 0/15 alone
# while the suite that runs those same binaries serially is 5/10, all under
# RUST_TEST_THREADS = "1". That was recorded here as "the suite-level runs are
# finding concurrency that per-binary runs do not, and this data does not say
# where", with `Database::open`'s three connections named as the suspect.
#
# There is no hidden concurrency. The suite makes far more cumulative connect()
# calls than any single binary does, and cumulative connect() is what the fault
# counts. A serialised suite is still a high-volume suite -- which is also why
# this setting reduces the rate without removing the fault, and why the three
# figures above (1/20, 0/30, 5/10) track suite SIZE rather than thread count.
#
# `[env]` does not override a value already in the environment, so setting
# RUST_TEST_THREADS yourself still works -- which is how you reproduce the fault
# if you are chasing it, or check whether an upstream release has fixed it.
#
# The three generated-history targets (doctrine, integrity, graph) are behind
# the `property-tests` feature and run as their own step, because a property
# case needs a database of its own and serialising does not save them:
# doctrine_property_tests faulted 3/4 and integrity_property_tests 1/4 in the
# same session, against ~3/25 recorded at 0.5.4. Quarantined, not silenced --
# proptest replays every previously found failure from .proptest-regressions
# before a single new case is generated.
#
# Re-measured at 0.7.0 on a larger sample: doctrine_property_tests alone,
# **9 crashes in 15 runs**, on a machine that had been building wheels all
# session. That sits between the two figures above rather than contradicting
# either, and it is the clearest statement of why these are quarantined: at 60%
# no retry budget makes them a gate. The Rust source was unchanged across the
# whole of that measurement -- P4-P6 touched only the binding crate, tests_py
# and docs -- so the variable is load, not code.
#
# Re-measured again at 0.8.0, and THIS FILE IS THE ONLY PLACE THE RATE LIVES.
# The figure had been copied into tests/doctrine_property_tests.rs and
# Cargo.toml, both of which still said `~3/25` (12%) from 0.5.4 while this file
# said 60% and ci.yml had already sized its six-attempt budget on 60%. In 0.8.0
# the stale copy was read as the baseline, the real rate was read as a
# regression against it, and the release was briefly reported as blocked on a
# defect that does not exist. Both copies now point here instead.
#
# The measurement, because the earlier ones were too small to support what was
# concluded from them. Binaries run directly (so RUST_TEST_THREADS must be set
# by hand -- `[env]` does not apply outside cargo), arms INTERLEAVED round-robin
# because load moves this number, n = 20 per arm:
#
#     doctrine built at v0.7.0                     9/20   45%
#     doctrine built at 55b7844 (0.8.0)           15/20   75%   <- exp. 1
#     doctrine built at 55b7844 (0.8.0)            9/20   45%   <- exp. 2, SAME binary
#     doctrine at 0.8.0, v0.7.0's property set    15/20   75%
#     integrity_property_tests (control)         4/20, 2/20
#
# **Read the third row before the second.** The same executable produced 75% and
# 45% in two consecutive experiments, and the arm with a property REMOVED scored
# above the arm with it -- impossible as a real effect. So the noise band on this
# instrument is about 30 points at n = 20, every published comparison here at
# n <= 20 is uninformative about arm differences, and there is no 0.8.0
# regression: the binary built at v0.7.0 faults at the same rate as HEAD's.
#
# That candidate is now TESTED and is not the mechanism (0.12.1, D-148). It was
# recorded here as: this binary drives everything through
# `Builder::new_multi_thread()`, and three connections per `Database::open` can
# overlap on different workers even with libtest serialised -- which is the
# concurrency this file could not locate. A current-thread build scored 10/20
# against 15/20 at n = 20, inside the noise band, settling nothing.
#
# `r15_soak --arm storm --sequential --current-thread` settles it directly: one
# task on a current-thread runtime, no overlap and no worker migration anywhere,
# faults 2/10 in release. The multi-thread runtime is not the trigger, and
# neither is any other arrangement of the same work in time. See the volume
# finding at the top of this file.
#
# Re-measured at 0.12.0, on the QUARANTINED STEP AS A WHOLE rather than on one
# binary, because that is the quantity README and ci.yml were both quoting and
# neither had measured. `run_rust_suite.py --features property-tests
# --attempts 1`, run 100 times back to back on an otherwise idle Windows box:
#
#     the quarantined step, per attempt              93/100   93%
#       of which doctrine_property_tests                 69
#       of which integrity_property_tests                23
#       of which one other binary                         1
#
# 95% interval 86-97%. Every figure this project had published for this was
# lower: README said "~50/50", ci.yml sized a six-attempt budget on p ~ 0.6, and
# run_rust_suite.py told the reader to expect a red step "roughly 1 run in 20".
# At 93% per attempt, six consecutive crashes is 0.93^6 = **65%** -- the
# quarantined step goes red about two runs in three, not one in twenty. All
# three now point here instead of restating a number.
#
# TWO CAVEATS, both load-bearing.
#
# 1. THIS IS THE SUSTAINED-LOAD REGIME. 100 suite runs back to back is a hot
#    machine by construction, and this file already records that load moves this
#    number by tens of points. It is the regime CI runs in and not the one a
#    developer running the suite once is in. A cold arm -- runs spaced minutes
#    apart -- is what would separate the two, and has not been measured.
#
# 2. A FLAKY TEST BIASES THIS DOWNWARD, and the first pass of this measurement
#    was biased by one. `classify()` reports FAILED before it looks for a crash,
#    so a run where one binary crashed AND another genuinely failed is counted
#    as a failure and the crash is invisible. Pass 1 of this study read 85 crashes
#    and 26 failures in 120 runs -- 71% -- with every one of those 26 failures the
#    same test, `bulk_import_is_atomic_per_chunk_not_overall`, made boundary-
#    sensitive by 0.12.0's adaptive chunk loop (D-147). With it fixed, pass 2 read
#    93%. The 71% was not a different session; it was this number with a bug
#    standing in front of it.
#
# AND IT DOES NOT PREDICT THE CI RUNNER, which is the thing worth carrying away.
# Six attempts at 93% would put the quarantined step red 65% of the time, and it
# is not: ci.yml records 2 red in 9 runs on `main`, which implies p ~ 0.78 there.
# So the published figures -- 45%, 60%, 75%, 78%, 93% -- are not competing
# estimates of one constant. They are five machines under five loads, and the
# rate is a property of the box, not of this crate. Quote the one you measured,
# name the machine and the load beside it, and do not carry it anywhere.
#
# And the fault is effectively Windows-only in practice. CI run 30770381302, the
# quarantined step: 46 s on macOS, 58 s on Ubuntu -- single attempts -- against
# 4 m 30 s on Windows.
#
# It also produced a textbook demonstration of the reporting hazard. With
# --no-fail-fast the run came back **308 passed, 0 failed** and exit 101: eight
# tests silently absent, and nothing in the pass/fail line saying so. See
# `tests_py/run_suite.py` for the Python-side gate built around exactly this,
# and D-107 for why the two sides need different checks.
#
# ---------------------------------------------------------------------------
# Production exposure
# ---------------------------------------------------------------------------
#
# Soaked and defended in 0.6.0 (T5.2, D-092), in the sharpened form -- ONE
# PROCESS, ONE FILE, A BOUNDED SET OF CONNECTIONS OPENED ONCE AND NEVER CHURNED.
# That wording matters: the old claim was about one `Database` handle, and a
# handle is not what the fault counts.
#
#     cargo run --release --example r15_soak -- --arm claim   --secs 60 --runs 6
#     cargo run --release --example r15_soak -- --arm control --secs 15 --runs 10
#
# claim is 0/6 at 60s and 0/10 at 15s; control, which adds 48 concurrent opens
# to the same load, is 2/10. The control is what makes the claim arm mean
# anything -- a clean claim run on its own is indistinguishable from a harness
# that provoked nothing. Run both or neither.
[env]
RUST_TEST_THREADS = "1"
